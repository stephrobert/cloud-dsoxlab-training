---
# Terrain du challenge 1, joué par `dsoxlab run` après le démarrage de feint.
#
# Il déclare dans feint l'environnement que l'apprenant devra chiffrer. Trois
# quantités sont TIRÉES AU HASARD à chaque run (nombre d'instances d'API, taille
# du volume de la base, nombre d'IP orphelines) : lire ce playbook ne donne pas
# la réponse, il faut lire l'environnement.
#
# Les identifiants créés vont dans le répertoire d'état du lab, hors du
# répertoire de travail : les tests s'en servent pour refuser un environnement
# modifié (supprimer une instance ferait baisser la facture sans rien estimer).
- name: Préparer l'environnement du pratiquer-challenge-budget-contraint
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    feint_url: http://127.0.0.1:4599
    projet: 11111111-1111-1111-1111-111111111111
    entetes:
      X-Auth-Token: "{{ projet }}"
  tasks:
    - name: Remettre feint à zéro
      ansible.builtin.uri:
        url: "{{ feint_url }}/_feint/state"
        method: PUT
        body_format: json
        body:
          format: feint-snapshot
          version: 1
          resources: []
        status_code: 200

    - name: Tirer les quantités de cet environnement
      ansible.builtin.set_fact:
        nb_api: "{{ [2, 3, 4] | random }}"
        go_base: "{{ [50, 100, 150] | random }}"
        nb_ip_orphelines: "{{ [1, 2] | random }}"

    - name: Poser le frontal et la base, présents à chaque tirage
      ansible.builtin.set_fact:
        instances:
          - name: boutique-front-1
            type: DEV1-S
            zone: fr-par-1
          - name: boutique-db-1
            type: GP1-XS
            zone: fr-par-2

    - name: Ajouter les instances d'API, réparties sur deux zones
      ansible.builtin.set_fact:
        instances: >-
          {{ instances + [{'name': 'boutique-api-' ~ item, 'type': 'DEV1-M',
                           'zone': ('fr-par-1' if item is odd else 'fr-par-2')}] }}
      loop: "{{ range(1, nb_api | int + 1) | list }}"

    - name: Créer les instances
      ansible.builtin.uri:
        url: "{{ feint_url }}/instance/v1/zones/{{ item.zone }}/servers"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          commercial_type: "{{ item.type }}"
          image: ubuntu_noble
          project: "{{ projet }}"
          dynamic_ip_required: false
        status_code: [200, 201]
      loop: "{{ instances }}"
      register: serveurs

    - name: Démarrer les instances
      ansible.builtin.uri:
        url: "{{ feint_url }}/instance/v1/zones/{{ item.item.zone }}/servers/{{ item.json.server.id }}/action"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          action: poweron
        status_code: [200, 202]
      loop: "{{ serveurs.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Créer le volume de données de la base
      ansible.builtin.uri:
        url: "{{ feint_url }}/block/v1alpha1/zones/fr-par-2/volumes"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          name: boutique-db-donnees
          project_id: "{{ projet }}"
          from_empty:
            size: "{{ (go_base | int) * 1000000000 }}"
          perf_iops: 5000
        status_code: [200, 201]
      register: volume_base

    - name: Attacher le volume de données à la base
      ansible.builtin.uri:
        url: "{{ feint_url }}/instance/v1/zones/fr-par-2/servers/{{ (serveurs.results | selectattr('item.name', 'equalto', 'boutique-db-1') | first).json.server.id }}/attach-volume"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          volume_id: "{{ volume_base.json.id }}"
          volume_type: sbs_volume
        status_code: [200, 201]

    - name: Créer le volume de sauvegardes, oublié et rattaché à rien
      ansible.builtin.uri:
        url: "{{ feint_url }}/block/v1alpha1/zones/fr-par-1/volumes"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          name: boutique-sauvegardes
          project_id: "{{ projet }}"
          from_empty:
            size: 200000000000
          perf_iops: 5000
        status_code: [200, 201]

    - name: Créer les IP flexibles orphelines
      ansible.builtin.uri:
        url: "{{ feint_url }}/instance/v1/zones/fr-par-1/ips"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          project: "{{ projet }}"
          type: routed_ipv4
        status_code: [200, 201]
      loop: "{{ range(nb_ip_orphelines | int) | list }}"

    - name: Créer l'IP de la passerelle
      ansible.builtin.uri:
        url: "{{ feint_url }}/vpc-gw/v2/zones/fr-par-1/ips"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          project_id: "{{ projet }}"
        status_code: [200, 201]
      register: ip_passerelle

    - name: Créer la passerelle
      ansible.builtin.uri:
        url: "{{ feint_url }}/vpc-gw/v2/zones/fr-par-1/gateways"
        method: POST
        headers: "{{ entetes }}"
        body_format: json
        body:
          name: boutique-gw
          project_id: "{{ projet }}"
          type: VPC-GW-S
          ip_id: "{{ ip_passerelle.json.id }}"
        status_code: [200, 201]

    - name: Relever l'inventaire de référence
      ansible.builtin.uri:
        url: "{{ feint_url }}/_feint/state"
        return_content: true
      register: etat

    - name: Ranger les identifiants hors du répertoire de travail
      ansible.builtin.copy:
        dest: "{{ lab_state_dir }}/environnement.json"
        mode: "0600"
        content: "{{ etat.json.resources | map(attribute='ID') | list | sort | to_json }}"
