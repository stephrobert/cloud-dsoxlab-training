id: pratiquer-choisir-modele-cloud
title: "Choose a cloud service and deployment model"
level: a
description: >-
  Select a service model and deployment model for a workload, then state the
  responsibilities that remain with the provider and the team.
skills:
  - cloud.model.choose
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/cloud/fondamentaux/modeles-cloud-iaas-paas-saas/
lab_type: lab
estimated_time: 30m
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - brief.json
validation:
  functional: true
criteria:
  - id: modele-de-service
    label: "The service model follows the brief"
    tests:
      - test_le_modele_de_service_suit_le_brief
    lessons:
      - https://www.stephane-robert.info/docs/cloud/fondamentaux/modeles-cloud-iaas-paas-saas/
  - id: modele-de-deploiement
    label: "The deployment model follows the brief"
    tests:
      - test_le_modele_de_deploiement_suit_le_brief
    lessons:
      - https://www.stephane-robert.info/docs/cloud/fondamentaux/modeles-cloud-iaas-paas-saas/
  - id: responsabilites
    label: "Responsibilities are shared as the model implies, with a rationale"
    tests:
      - test_les_responsabilites_sont_partagees_selon_le_modele
    lessons:
      - https://www.stephane-robert.info/docs/cloud/fondamentaux/modeles-cloud-iaas-paas-saas/
