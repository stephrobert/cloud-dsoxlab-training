id: reseau-prive-scaleway
title: "Réseau privé, et premières instances sans adresse publique : scw sur Feint"
description: >-
  Avec le CLI officiel scw branché sur l'émulateur feint, construire un VPC et
  un Private Network régionaux, deux instances sans IP publique dans deux
  zones, une NIC privée par zone, et une Public Gateway qui pousse la route par
  défaut. Noté sur l'état que feint conserve, jamais sur les commandes tapées.
