title: "Choisir un modèle de calcul et le dimensionner sur des mesures"
description: >-
  Choisir un modèle de calcul pour une charge continue, puis dimensionner une
  machine compatible à partir des mesures CPU et mémoire au 95e centile d'une semaine.
criteria:
  - id: modele
    label: "Le modèle de calcul tient les contraintes d'exécution, justification comprise"
  - id: architecture
    label: "L'architecture est une de celles où la dépendance native est testée"
  - id: demande
    label: "La demande vient du p95 de la semaine et de la croissance prévue"
  - id: profil
    label: "Le profil est le moins cher qui tient la demande"
