[project]
name = "cloud-dsoxlab-training"
version = "0.2.1"
description = "Labs de la formation Cloud, joués sans compte : fournisseur de labs pour la CLI dsoxlab"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
# Jeu de règles repris des catalogues Kubernetes et DevSecOps, à l'identique :
# un contributeur qui passe d'un dépôt à l'autre ne réapprend pas ce qui est
# accepté.
target-version = "py311"
exclude = [
    "labs/**/fixtures",
    "labs/**/challenge/work",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I",
    "UP",
    "B",
    "BLE",
    "SIM",
    "RUF",
    "EXE",
    "DTZ",
    "PLE", "PLW",
    "S",
]
ignore = [
    "E501",
    # `assert` est le verbe de pytest.
    "S101",
    # Appeler incus, scw et ansible-vault depuis le PATH est le métier de ce
    # dépôt : c'est ainsi que l'apprenant les appelle.
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
"labs/**/test_functional.py" = ["PLR2004"]

[tool.pytest.ini_options]
# Tous les tests de labs s'appellent challenge/tests/test_functional.py, dans
# des répertoires sans __init__.py : importlib les isole par leur chemin.
addopts = "--import-mode=importlib"
testpaths = ["labs"]
norecursedirs = ["solution", "solution-en-clair", "*.egg", ".git", ".venv"]

[tool.uv]
# Ce dépôt n'est pas un package Python : c'est un fournisseur de labs. dsoxlab
# s'installe à part (`uv tool install dsoxlab`) et embarque pytest et testinfra.
package = false

[dependency-groups]
dev = [
    "pyyaml>=6",
    "pytest>=8",
    "jsonschema>=4",
]
